name: Daily Paper Update

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  update-papers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml biopython keyring yagmail
      - name: Run Scitify
        run: |
          cd Scitify-main/bin
          bash run_paper_update.sh
